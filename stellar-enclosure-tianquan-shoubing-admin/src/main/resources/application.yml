spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: tianquan-shoubing-admin
  profiles:
    default: cloud-native
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - top.egon.cola.component.yuheng.openapi.config.GatewayOpenApiAutoConfiguration
  datasource:
    url: ${TIANQUAN_SHOUBING_POSTGRES_URL}
    username: ${TIANQUAN_SHOUBING_POSTGRES_USER}
    password: ${TIANQUAN_SHOUBING_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${TIANQUAN_SHOUBING_REDIS_HOST}
      port: ${TIANQUAN_SHOUBING_REDIS_PORT:6379}
      password: ${TIANQUAN_SHOUBING_REDIS_PASSWORD:}
      database: ${TIANQUAN_SHOUBING_REDIS_DATABASE:0}
      timeout: ${TIANQUAN_SHOUBING_REDIS_TIMEOUT:2s}
  flyway:
    enabled: false
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: ${TIANQUAN_SHOUBING_BIND_ADDRESS:0.0.0.0}
  ssl:
    enabled: false
  forward-headers-strategy: NONE
  port: ${TIANQUAN_SHOUBING_ADVERTISED_PORT:18120}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${TIANQUAN_SHOUBING_HTTP_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: tianquan-shoubing-identity
      paths-to-match:
        - /api/v1/tianquan-shoubing/clients/**
        - /api/v1/tianquan-shoubing/resource-servers/**
        - /api/v1/tianquan-shoubing/signing-keys/**
        - /api/v1/tianquan-shoubing/tenants/**
        - /api/v1/tianquan-shoubing/users/**
    - group: tianquan-shoubing-audit
      paths-to-match:
        - /api/v1/tianquan-shoubing/audits/**
    - group: tianquan-shoubing-auth
      paths-to-match:
        - /api/v1/tianquan-shoubing/auth/**
        - /api/v1/authorization/effective-permissions
        - /api/v1/authorization/field-catalog
    - group: tianquan-shoubing-profile
      paths-to-match:
        - /api/v1/tianquan-shoubing/me
        - /api/v1/tianquan-shoubing/me/sessions/**
        - /oauth2/userinfo
    - group: tianquan-shoubing-oauth
      paths-to-match:
        - /oauth2/**
        - /.well-known/**
      paths-to-exclude:
        - /oauth2/userinfo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping,idpRuntime,tianquanAuditReadiness
      probes:
        enabled: true

egon.cola.platform:
  tianquan:
    shoubing:
      usage-observation:
        receiver: SHOUBING
        enabled: true
        fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
        allow-local-plaintext: false
      trusted-issuers:
        tenant-a:
          issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
          jwks-uri: ${TIANQUAN_SHOUBING_TENANT_A_JWKS_URI}
          realm-key: ${TIANQUAN_SHOUBING_TENANT_A_REALM_KEY}
          realm-type: TENANT
          tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
          status: ACTIVE
          trust-version: ${TIANQUAN_SHOUBING_TENANT_A_TRUST_VERSION}
        tenant-b:
          issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
          jwks-uri: ${TIANQUAN_SHOUBING_TENANT_B_JWKS_URI}
          realm-key: ${TIANQUAN_SHOUBING_TENANT_B_REALM_KEY}
          realm-type: TENANT
          tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
          status: ACTIVE
          trust-version: ${TIANQUAN_SHOUBING_TENANT_B_TRUST_VERSION}
        platform:
          issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
          jwks-uri: ${TIANQUAN_SHOUBING_PLATFORM_JWKS_URI}
          realm-key: platform
          realm-type: PLATFORM
          status: ACTIVE
          trust-version: ${TIANQUAN_SHOUBING_PLATFORM_TRUST_VERSION}
      enabled: ${UNIFIED_IDENTITY_ENABLED:true}
      register-filter: false
      issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      service-client:
        app-id: ${TIANQUAN_SHOUBING_RBAC_APP_ID}
        tenant-registration-ids:
          "[${TIANQUAN_SHOUBING_CATALOG_TENANT_ID}]": ${TIANQUAN_SHOUBING_RBAC_REGISTRATION_ID}
        credential-versions:
          "[${TIANQUAN_SHOUBING_RBAC_REGISTRATION_ID}]": ${TIANQUAN_SHOUBING_RBAC_CREDENTIAL_VERSION:1}
      rpc:
        enabled: ${TIANQUAN_SHOUBING_RPC_ENABLED:true}
        provider:
          enabled: ${TIANQUAN_SHOUBING_RPC_PROVIDER_ENABLED:true}
          methods:
            "[egon.tianquan.shoubing.v1.IdentityDirectoryService/BatchGetIdentityProfiles]":
              principal-kind: SERVICE
              scope-context: TENANT
              expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI}
              required-scopes: [identity:read]
            "[egon.tianquan.shoubing.v1.IdentityDirectoryService/GetTenantMembership]":
              principal-kind: SERVICE
              scope-context: TENANT
              expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI}
              required-scopes: [identity:read]
      resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID}
      resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI}
      audit:
        consumer-delay: ${EGON_TIANQUAN_SHOUBING_OAUTH_AUDIT_CONSUMER_DELAY:1000}
    jianshen:
      user-scope-policy:
        enabled: true
        permission-scopes:
          "[tianquan-shoubing:audit:read]": ["tianquan-shoubing:audit:read"]
          "[tianquan-shoubing:bootstrap:read]": ["tianquan-shoubing:bootstrap:read"]
          "[tianquan-shoubing:identity-user:create]": ["tianquan-shoubing:identity-user:create"]
          "[tianquan-shoubing:identity-user:password-reset]": ["tianquan-shoubing:identity-user:password-reset"]
          "[tianquan-shoubing:identity-user:read]": ["tianquan-shoubing:identity-user:read"]
          "[tianquan-shoubing:identity-user:revoke-all]": ["tianquan-shoubing:identity-user:revoke-all"]
          "[tianquan-shoubing:identity-user:update]": ["tianquan-shoubing:identity-user:update"]
          "[tianquan-shoubing:identity:self:read]": ["tianquan-shoubing:identity:self:read"]
          "[tianquan-shoubing:identity:self:session-revoke]": ["tianquan-shoubing:identity:self:session-revoke"]
          "[tianquan-shoubing:oauth-client:create]": ["tianquan-shoubing:oauth-client:create"]
          "[tianquan-shoubing:oauth-client:read]": ["tianquan-shoubing:oauth-client:read"]
          "[tianquan-shoubing:oauth-client:update]": ["tianquan-shoubing:oauth-client:update"]
          "[tianquan-shoubing:resource-server:create]": ["tianquan-shoubing:resource-server:create"]
          "[tianquan-shoubing:resource-server:grant]": ["tianquan-shoubing:resource-server:grant"]
          "[tianquan-shoubing:resource-server:read]": ["tianquan-shoubing:resource-server:read"]
          "[tianquan-shoubing:resource-server:status]": ["tianquan-shoubing:resource-server:status"]
          "[tianquan-shoubing:signing-key:activate]": ["tianquan-shoubing:signing-key:activate"]
          "[tianquan-shoubing:signing-key:publish]": ["tianquan-shoubing:signing-key:publish"]
          "[tianquan-shoubing:signing-key:read]": ["tianquan-shoubing:signing-key:read"]
          "[tianquan-shoubing:signing-key:retire]": ["tianquan-shoubing:signing-key:retire"]
          "[tianquan-shoubing:tenant:manage]": ["tianquan-shoubing:tenant:manage"]
          "[tianquan-shoubing:tenant:read]": ["tianquan-shoubing:tenant:read"]
      enabled: ${UNIFIED_IDENTITY_ENABLED:true}
      register-filter: false
      system-code: tianquan-shoubing
      runtime:
        artifact-digest: ${TIANQUAN_SHOUBING_ARTIFACT_DIGEST:}
        catalog-scopes:
          - catalog-scope-id: ${TIANQUAN_SHOUBING_CATALOG_SCOPE_ID}
            tenant-id: ${TIANQUAN_SHOUBING_CATALOG_TENANT_ID}
            business-code: xingyuan
            application-code: tianquan-shoubing
            namespace-code: ${TIANQUAN_SHOUBING_CATALOG_NAMESPACE}
            environment: ${DEPLOYMENT_ENV}
      authorization:
        endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT}
        service-token:
          enabled: ${TIANQUAN_SHOUBING_RBAC_SERVICE_TOKEN_ENABLED:true}
          resource-uri: ${TIANQUAN_SHOUBING_RBAC_RESOURCE_URI}
          scopes: [service:authorization:snapshot, service:authorization:policy]

egon:
  tianquan-shoubing:
    shared-redis:
      endpoints: ${STELLAR_SHARED_ID_REDIS_ENDPOINTS:}
      username: ${STELLAR_SHARED_ID_REDIS_USERNAME:}
      password: ${STELLAR_SHARED_ID_REDIS_PASSWORD:}
      timeout: ${STELLAR_SHARED_ID_REDIS_TIMEOUT:2s}
    clock-skew: ${EGON_TIANQUAN_SHOUBING_CLOCK_SKEW:30s}
    identity-directory:
      platform-storage-partition-id: ${EGON_TIANQUAN_SHOUBING_PLATFORM_STORAGE_PARTITION_ID}
    oauth:
      public-origin: ${EGON_TIANQUAN_SHOUBING_OAUTH_PUBLIC_ORIGIN}
      authentication-ttl: ${EGON_TIANQUAN_SHOUBING_OAUTH_AUTHENTICATION_TTL:PT8H}
      platform-management-tenant-id: ${EGON_TIANQUAN_SHOUBING_PLATFORM_MANAGEMENT_TENANT_ID}
      allowed-origins: ${TIANQUAN_SHOUBING_OAUTH_ALLOWED_ORIGINS:}
      key-encryption:
        key-id: ${EGON_TIANQUAN_SHOUBING_OAUTH_KEK_ID}
        key-file: ${EGON_TIANQUAN_SHOUBING_OAUTH_KEK_FILE}
      key-rotation:
        period: ${EGON_TIANQUAN_SHOUBING_OAUTH_KEY_ROTATION_PERIOD:90d}
        prepublish: ${EGON_TIANQUAN_SHOUBING_OAUTH_KEY_PREPUBLISH:24h}
        verification-overlap: ${EGON_TIANQUAN_SHOUBING_OAUTH_KEY_VERIFICATION_OVERLAP:}
        schedule: ${EGON_TIANQUAN_SHOUBING_OAUTH_KEY_ROTATION_SCHEDULE:0 0 2 * * *}
  cola:
    component:
      cache:
        enabled: false
      id:
        enabled: true
        # Every writer in the same numeric ID domain uses this exact Redis authority and pool key.
        redis:
          enabled: true
          env: ${STELLAR_SHARED_ID_ENV:${DEPLOYMENT_ENV}}
          app: ${STELLAR_SHARED_ID_DOMAIN}
          lease-duration: ${STELLAR_SHARED_ID_LEASE_DURATION:5m}
          renew-interval: ${STELLAR_SHARED_ID_RENEW_INTERVAL:1m}
      access-guard:
        enabled: true
        storage: REDISSON
        redisson:
          client-bean-name: redissonClient
          application: tianquan-shoubing-identity-directory
      yuheng:
        openapi:
          enabled: ${TIANQUAN_SHOUBING_HTTP_OPENAPI_ENABLED:false}
          publish-to-ddc: false
          published-groups:
            - tianquan-shoubing-identity
            - tianquan-shoubing-audit
            - tianquan-shoubing-auth
            - tianquan-shoubing-profile
            - tianquan-shoubing-oauth
          biz-code: ${TIANQUAN_SHOUBING_RESOURCE_BIZ_CODE:permission}
          application-code: ${TIANQUAN_SHOUBING_RESOURCE_APP_CODE:tianquan-shoubing}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
          artifact-version: ${TIANQUAN_SHOUBING_ARTIFACT_VERSION:local}
          build-id: ${TIANQUAN_SHOUBING_BUILD_ID:local}
      rpc:
        transport: h2c
        enabled: ${TIANQUAN_SHOUBING_RPC_ENABLED:true}
        identity:
          env: ${DEPLOYMENT_ENV:local}
          host: ${TIANQUAN_SHOUBING_ADVERTISED_HOST:127.0.0.1}
          instance-id: ${TIANQUAN_SHOUBING_INSTANCE_ID:tianquan-shoubing-local-1}
        provider:
          enabled: ${TIANQUAN_SHOUBING_RPC_PROVIDER_ENABLED:true}
          bind-address: ${TIANQUAN_SHOUBING_RPC_BIND_ADDRESS:0.0.0.0}
          port: ${TIANQUAN_SHOUBING_RPC_PORT:18122}
          admission:
            enabled: ${TIANQUAN_SHOUBING_RPC_PROVIDER_ADMISSION_ENABLED:true}
            max-concurrent: ${TIANQUAN_SHOUBING_RPC_MAX_CONCURRENT:64}
            methods:
              "[egon.tianquan.shoubing.v1.IdentityDirectoryService/GetTenantMembership]":
                quota: identity-directory:membership-read
                quota-capacity: ${TIANQUAN_SHOUBING_MEMBERSHIP_QUOTA_CAPACITY}
                quota-cost: 1
                max-attempts: 2
                replay-window: 5s
                physical-capacity: ${TIANQUAN_SHOUBING_MEMBERSHIP_PHYSICAL_CAPACITY}
                physical-window: 1s
              "[egon.tianquan.shoubing.v1.IdentityDirectoryService/BatchGetIdentityProfiles]":
                quota: identity-directory:profiles-read
                quota-capacity: ${TIANQUAN_SHOUBING_PROFILES_QUOTA_CAPACITY}
                quota-cost: 1
                max-attempts: 1
                replay-window: 5s
                physical-capacity: ${TIANQUAN_SHOUBING_PROFILES_PHYSICAL_CAPACITY}
                physical-window: 1s
        consumer:
          enabled: false
      mybatis-plus:
        ddl:
          enabled: true
          lock-timeout: 30s
          statement-timeout: 300s
          topology-ready-timeout: 60s
        sharding:
          enabled: true
          mode: SHARDING
          config-style: NATIVE
          native-rules-resource: classpath:oauth-sharding-native.yml
          transaction-default-type: LOCAL
          data-sources:
            - name: oauth_primary
              logical-name: oauth_primary
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: ${spring.datasource.url}
              username: ${spring.datasource.username}
              password: ${spring.datasource.password}
          tables: {}
        tenant-id:
          ignored-tables:
            - egon_cola_outbox_message
      transactional-outbox:
        enabled: true
        node-id: ${TIANQUAN_SHOUBING_INSTANCE_ID:tianquan-shoubing-local-1}
        retry:
          recover-exhausted: true
          exhausted-retry-delay: ${TIANQUAN_SHOUBING_OUTBOX_EXHAUSTED_RETRY_DELAY:PT5M}
        storage:
          data-source-bean-name: dataSource
          transaction-manager-bean-name: transactionManager
          mp:
            sql-session-factory-bean-name: sqlSessionFactory
            migration-mode: false
            auto-initialize-ddl: true
            migration-lock-timeout: 30s
            manifest-resource: db/egon-outbox-mp/manifest.json
        state-machine:
          business:
            enabled: false
      tianshu:
        enabled: false
        delivery:
          enabled: false

---
# Activate only with an immutable, deployment-pinned baseline and bounded offline validity.
# OAuth issuer/JWKS/KEK, database, revocation and Redis ID authority remain local bootstrap inputs.
spring:
  config:
    activate:
      on-profile: cloud-native
    import:
      - tianshu-baseline:${TIANQUAN_SHOUBING_TIANSHU_BASELINE_FILE:/var/run/tianshu/config/baseline.json}

management:
  endpoint:
    health:
      group:
        readiness:
          include: idpRuntime,tianquanAuditReadiness
        configDelivery:
          include: readinessState

egon.cola.platform:
  tianquan:
    shoubing:
      projection:
        required: true
        jwks-file: ${TIANQUAN_SHOUBING_PROJECTED_JWKS_FILE:/var/run/tianquan/identity/jwks.json}
        service-credentials-file: ${TIANQUAN_SHOUBING_PROJECTED_SERVICE_CREDENTIALS_FILE:/var/run/tianquan/identity/service-credentials.json}
      service-client:
        registration-id: ${TIANQUAN_SHOUBING_CONFIG_REGISTRATION_ID}
      # Canonical endpoints keep their HTTPS identity; these exact tuples select internal HTTP.
      transport:
        bindings:
          shoubing-config-token:
            version: ${TIANQUAN_SHOUBING_CONFIG_TOKEN_BINDING_VERSION}
            canonical-issuer: ${TIANQUAN_SHOUBING_CONFIG_ISSUER}
            canonical-endpoint: ${TIANQUAN_SHOUBING_CONFIG_ISSUER}/oauth2/token
            resource: ${TIANQUAN_SHOUBING_CONFIG_RESOURCE_URI}
            registration-id: ${TIANQUAN_SHOUBING_CONFIG_REGISTRATION_ID}
            operation: TOKEN
            method: POST
            path: ${TIANQUAN_SHOUBING_CONFIG_TOKEN_PATH}
            namespace: ${TIANQUAN_SHOUBING_TOKEN_SERVICE_NAMESPACE}
            service: ${TIANQUAN_SHOUBING_TOKEN_SERVICE}
            port: ${TIANQUAN_SHOUBING_TOKEN_SERVICE_PORT:18120}
            transport: HTTP
          shoubing-rbac-token:
            version: ${TIANQUAN_SHOUBING_RBAC_TOKEN_BINDING_VERSION}
            canonical-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
            canonical-endpoint: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}/oauth2/token
            resource: ${TIANQUAN_SHOUBING_RBAC_RESOURCE_URI}
            registration-id: ${TIANQUAN_SHOUBING_RBAC_REGISTRATION_ID}
            operation: TOKEN
            method: POST
            path: ${TIANQUAN_SHOUBING_RBAC_TOKEN_PATH}
            namespace: ${TIANQUAN_SHOUBING_TOKEN_SERVICE_NAMESPACE}
            service: ${TIANQUAN_SHOUBING_TOKEN_SERVICE}
            port: ${TIANQUAN_SHOUBING_TOKEN_SERVICE_PORT:18120}
            transport: HTTP

egon:
  cola:
    component:
      rpc:
        identity:
          env: ${DEPLOYMENT_ENV}
          host: ${POD_IP}
          instance-id: ${POD_UID}
      transactional-outbox:
        node-id: ${POD_UID}
      tianshu:
        enabled: true
        baseline:
          file: ${TIANQUAN_SHOUBING_TIANSHU_BASELINE_FILE:/var/run/tianshu/config/baseline.json}
          scope:
            tenant-id: ${TIANSHU_TENANT_ID}
            biz-code: ${TIANQUAN_SHOUBING_RESOURCE_BIZ_CODE:permission}
            env: ${DEPLOYMENT_ENV}
            app-code: ${TIANQUAN_SHOUBING_RESOURCE_APP_CODE:tianquan-shoubing}
            resource-name: application.yml
          target:
            binding-id: ${TIANQUAN_SHOUBING_CONFIG_TARGET_BINDING_ID}
            binding-revision: ${TIANQUAN_SHOUBING_CONFIG_TARGET_BINDING_REVISION}
            cluster-id: ${CLUSTER_ID}
            kubernetes-namespace: ${POD_NAMESPACE}
            workload-uid: ${WORKLOAD_UID}
            container-name: ${TIANQUAN_SHOUBING_CONTAINER_NAME:application}
        delivery:
          enabled: true
          service-origin: ${TIANSHU_CONFIG_SERVICE_ORIGIN:http://tianshu-config.platform-system.svc.cluster.local}
          workload-token-file: ${TIANQUAN_SHOUBING_WORKLOAD_TOKEN_FILE:/var/run/tianshu/identity/workload-token}
          state-directory: ${TIANQUAN_SHOUBING_CONFIG_STATE_DIRECTORY:/var/run/tianshu/state}
          pod-uid: ${POD_UID}
          registration-id: ${TIANQUAN_SHOUBING_CONFIG_REGISTRATION_ID}
          app-id: ${TIANQUAN_SHOUBING_RBAC_APP_ID}
          identity-tenant-id: ${TIANQUAN_SHOUBING_CONFIG_IDENTITY_TENANT_ID}
          expected-issuer: ${TIANQUAN_SHOUBING_CONFIG_ISSUER}
          canonical-audience: ${TIANQUAN_SHOUBING_CONFIG_RESOURCE_URI}
          request-timeout: ${TIANQUAN_SHOUBING_CONFIG_REQUEST_TIMEOUT:15s}
          poll-interval: ${TIANQUAN_SHOUBING_CONFIG_POLL_INTERVAL:30s}
          max-stale: ${TIANQUAN_SHOUBING_CONFIG_MAX_STALE:5m}
          allow-offline-start: true
          # Deployment supplies the verified immutable baseline's real expiry; there is no generated TTL.
          baseline-valid-until: ${TIANQUAN_SHOUBING_BASELINE_VALID_UNTIL}
