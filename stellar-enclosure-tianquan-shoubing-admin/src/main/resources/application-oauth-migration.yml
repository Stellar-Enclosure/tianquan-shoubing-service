# Explicit offline migration profile. Dry-run is the default; apply still requires the approved report digest.
spring:
  main:
    web-application-type: none

server:
  ssl:
    enabled: false
  forward-headers-strategy: NONE

egon:
  cola:
    component:
      rpc:
        enabled: false
        transport: h2c
        provider:
          enabled: false
          admission:
            enabled: false
      tianshu:
        enabled: false
        delivery:
          enabled: false
  tianquan-shoubing:
    oauth:
      migration:
        enabled: false
        dry-run: true

egon.cola.platform:
  tianquan:
    shoubing:
      rpc:
        enabled: false
        provider:
          enabled: false
      revocation:
        primary-endpoint: ${TIANQUAN_SHOUBING_REVOCATION_PRIMARY_ENDPOINT}
      usage-observation:
        receiver: SHOUBING
        enabled: false
        fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
        allow-local-plaintext: false
      audit:
        delivery:
          receipt-ttl: PT1H
          confirmation-timeout: PT30S
          batch-size: 100

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping
